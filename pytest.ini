[pytest]
# The host may expose ROS2 pytest entry points through PYTHONPATH.  This
# project test suite is intentionally ROS-free and must not import them.
python_files = test_*.py
addopts =
    -p no:launch_testing
    -p no:launch_ros
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:ament_pep257
    -p no:ament_xmllint
    -p no:ament_lint
