<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #475569; }
      .axis { font: 700 22px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #1e293b; }
      .tick { font: 500 15px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #475569; }
      .cell { font: 600 13px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #64748b; }
      .legend-title { font: 700 22px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #0f172a; }
      .legend { font: 400 17px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #334155; }
      .note { font: 500 17px 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif; fill: #1e40af; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f8fafc"/>
  <text x="600" y="55" text-anchor="middle" class="title">孔洞随机化：5×5 分层采样网格</text>
  <text x="600" y="86" text-anchor="middle" class="subtitle">墙面 X–Z 平面；Y（插入深度方向）保持固定</text>

  <!-- Main plot card -->
  <rect x="55" y="115" width="780" height="720" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>

  <!-- 5x5 cells: plot bounds x=150..750, y=170..770, each 120px -->
  <g>
    <rect x="150" y="170" width="120" height="120" fill="#eff6ff"/>
    <rect x="270" y="170" width="120" height="120" fill="#f8fafc"/>
    <rect x="390" y="170" width="120" height="120" fill="#eff6ff"/>
    <rect x="510" y="170" width="120" height="120" fill="#f8fafc"/>
    <rect x="630" y="170" width="120" height="120" fill="#eff6ff"/>

    <rect x="150" y="290" width="120" height="120" fill="#f8fafc"/>
    <rect x="270" y="290" width="120" height="120" fill="#eff6ff"/>
    <rect x="390" y="290" width="120" height="120" fill="#f8fafc"/>
    <rect x="510" y="290" width="120" height="120" fill="#eff6ff"/>
    <rect x="630" y="290" width="120" height="120" fill="#f8fafc"/>

    <rect x="150" y="410" width="120" height="120" fill="#eff6ff"/>
    <rect x="270" y="410" width="120" height="120" fill="#f8fafc"/>
    <rect x="390" y="410" width="120" height="120" fill="#dbeafe"/>
    <rect x="510" y="410" width="120" height="120" fill="#f8fafc"/>
    <rect x="630" y="410" width="120" height="120" fill="#eff6ff"/>

    <rect x="150" y="530" width="120" height="120" fill="#f8fafc"/>
    <rect x="270" y="530" width="120" height="120" fill="#eff6ff"/>
    <rect x="390" y="530" width="120" height="120" fill="#f8fafc"/>
    <rect x="510" y="530" width="120" height="120" fill="#eff6ff"/>
    <rect x="630" y="530" width="120" height="120" fill="#f8fafc"/>

    <rect x="150" y="650" width="120" height="120" fill="#eff6ff"/>
    <rect x="270" y="650" width="120" height="120" fill="#f8fafc"/>
    <rect x="390" y="650" width="120" height="120" fill="#eff6ff"/>
    <rect x="510" y="650" width="120" height="120" fill="#f8fafc"/>
    <rect x="630" y="650" width="120" height="120" fill="#eff6ff"/>
  </g>

  <!-- Grid -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="150" y1="170" x2="150" y2="770"/>
    <line x1="270" y1="170" x2="270" y2="770"/>
    <line x1="390" y1="170" x2="390" y2="770"/>
    <line x1="510" y1="170" x2="510" y2="770"/>
    <line x1="630" y1="170" x2="630" y2="770"/>
    <line x1="750" y1="170" x2="750" y2="770"/>
    <line x1="150" y1="170" x2="750" y2="170"/>
    <line x1="150" y1="290" x2="750" y2="290"/>
    <line x1="150" y1="410" x2="750" y2="410"/>
    <line x1="150" y1="530" x2="750" y2="530"/>
    <line x1="150" y1="650" x2="750" y2="650"/>
    <line x1="150" y1="770" x2="750" y2="770"/>
  </g>

  <!-- Cell labels -->
  <g class="cell" text-anchor="start">
    <text x="160" y="190">R1C1</text><text x="280" y="190">R1C2</text><text x="400" y="190">R1C3</text><text x="520" y="190">R1C4</text><text x="640" y="190">R1C5</text>
    <text x="160" y="310">R2C1</text><text x="280" y="310">R2C2</text><text x="400" y="310">R2C3</text><text x="520" y="310">R2C4</text><text x="640" y="310">R2C5</text>
    <text x="160" y="430">R3C1</text><text x="280" y="430">R3C2</text><text x="400" y="430">R3C3</text><text x="520" y="430">R3C4</text><text x="640" y="430">R3C5</text>
    <text x="160" y="550">R4C1</text><text x="280" y="550">R4C2</text><text x="400" y="550">R4C3</text><text x="520" y="550">R4C4</text><text x="640" y="550">R4C5</text>
    <text x="160" y="670">R5C1</text><text x="280" y="670">R5C2</text><text x="400" y="670">R5C3</text><text x="520" y="670">R5C4</text><text x="640" y="670">R5C5</text>
  </g>

  <!-- 25 anchors -->
  <g fill="#2563eb" stroke="#ffffff" stroke-width="3">
    <circle cx="210" cy="230" r="8"/><circle cx="330" cy="230" r="8"/><circle cx="450" cy="230" r="8"/><circle cx="570" cy="230" r="8"/><circle cx="690" cy="230" r="8"/>
    <circle cx="210" cy="350" r="8"/><circle cx="330" cy="350" r="8"/><circle cx="450" cy="350" r="8"/><circle cx="570" cy="350" r="8"/><circle cx="690" cy="350" r="8"/>
    <circle cx="210" cy="470" r="8"/><circle cx="330" cy="470" r="8"/><circle cx="450" cy="470" r="10" fill="#dc2626"/><circle cx="570" cy="470" r="8"/><circle cx="690" cy="470" r="8"/>
    <circle cx="210" cy="590" r="8"/><circle cx="330" cy="590" r="8"/><circle cx="450" cy="590" r="8"/><circle cx="570" cy="590" r="8"/><circle cx="690" cy="590" r="8"/>
    <circle cx="210" cy="710" r="8"/><circle cx="330" cy="710" r="8"/><circle cx="450" cy="710" r="8"/><circle cx="570" cy="710" r="8"/><circle cx="690" cy="710" r="8"/>
  </g>

  <!-- Example in-cell jitter -->
  <circle cx="603" cy="326" r="8" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
  <line x1="570" y1="350" x2="599" y2="330" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/>
  <text x="608" y="318" class="note">单元内扰动样本</text>

  <!-- Axes -->
  <line x1="150" y1="805" x2="778" y2="805" stroke="#334155" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <line x1="115" y1="770" x2="115" y2="142" stroke="#334155" stroke-width="3" marker-end="url(#arrow-gray)"/>
  <text x="790" y="813" class="axis">+X</text>
  <text x="96" y="140" class="axis">+Z</text>

  <!-- Boundary ticks X -->
  <g class="tick" text-anchor="middle">
    <text x="150" y="795">−60</text><text x="270" y="795">−36</text><text x="390" y="795">−12</text>
    <text x="510" y="795">12</text><text x="630" y="795">36</text><text x="750" y="795">60</text>
  </g>
  <!-- Center coordinates X -->
  <g class="tick" text-anchor="middle" fill="#2563eb">
    <text x="210" y="830">−48</text><text x="330" y="830">−24</text><text x="450" y="830">0</text><text x="570" y="830">24</text><text x="690" y="830">48</text>
  </g>
  <text x="450" y="858" class="subtitle" text-anchor="middle">X 偏移（mm）</text>

  <!-- Boundary ticks Z -->
  <g class="tick" text-anchor="end" dominant-baseline="middle">
    <text x="140" y="170">60</text><text x="140" y="290">36</text><text x="140" y="410">12</text>
    <text x="140" y="530">−12</text><text x="140" y="650">−36</text><text x="140" y="770">−60</text>
  </g>
  <!-- Center coordinates Z -->
  <g class="tick" text-anchor="end" dominant-baseline="middle" fill="#2563eb">
    <text x="105" y="230">48</text><text x="105" y="350">24</text><text x="105" y="470">0</text><text x="105" y="590">−24</text><text x="105" y="710">−48</text>
  </g>

  <!-- Legend card -->
  <rect x="865" y="115" width="290" height="720" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="900" y="165" class="legend-title">如何理解这张图</text>

  <circle cx="905" cy="215" r="8" fill="#2563eb"/>
  <text x="930" y="221" class="legend">25 个单元中心</text>

  <circle cx="905" cy="260" r="9" fill="#dc2626"/>
  <text x="930" y="266" class="legend">XML 基准孔位</text>
  <text x="930" y="290" class="tick">偏移 (0, 0) mm</text>

  <circle cx="905" cy="335" r="8" fill="#f59e0b"/>
  <text x="930" y="341" class="legend">实际采样孔位</text>
  <text x="930" y="365" class="tick">在选中单元内随机</text>

  <line x1="895" y1="410" x2="930" y2="410" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/>
  <text x="945" y="416" class="legend">随机扰动</text>

  <line x1="895" y1="458" x2="1125" y2="458" stroke="#e2e8f0" stroke-width="2"/>

  <text x="900" y="500" class="legend-title">推荐采集规则</text>
  <text x="900" y="540" class="legend">1. 选择样本最少的单元</text>
  <text x="900" y="575" class="legend">2. 单元内随机 ±8 mm</text>
  <text x="900" y="610" class="legend">3. 每格保留 ≥10 条成功轨迹</text>
  <text x="900" y="645" class="legend">4. 打乱 25 个单元的采集顺序</text>

  <rect x="895" y="690" width="230" height="105" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1010" y="723" text-anchor="middle" class="note">覆盖范围</text>
  <text x="1010" y="752" text-anchor="middle" class="legend">X, Z ∈ [−60, 60] mm</text>
  <text x="1010" y="778" text-anchor="middle" class="legend">Y 偏移 = 0 mm</text>
</svg>
