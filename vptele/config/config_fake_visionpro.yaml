# Fake VisionPro data source
vp_ip: "127.0.0.1"
vp_record: false
vuer: false
video_enabled: false

# Robot configuration (same dual-arm setup as config_arm_right.yaml)
robot_ip: "169.254.128.19"
robot_port: 8080
robot_level: 3
robot_thread_mode: 2
arm_model: "RM_75"

algo_config:
  install_angle: [0, 0, 0]
  workframe: [0, 0, 0, 0, -0.785, 0]
  toolframe:
    pose: [0, 0, 0, 0, 0, 0]
    payload: 0.0
    center_of_mass: [0, 0, 0]

robot_control:
  max_line_speed: 0.1
  max_line_acc: 1.0
  collision_level: 3
  initial_pose: [0.26, 0.35, 0.15, 3.14, 0, -1.4]

trajectory_config:
  save_dir: "trajectories/right"
  trajectory_dir: "trajectories/right"
  record_frequency: 0.01
  record_joint_angles: true
  record_cartesian_pose: true
  speed_factor: 1.0
  use_joint_control: true

end_effector: "gripper"

arm_config:
  leftright: "right"
  scaling_factor: 1.0
  smoothing_factor: 0.99
  update_frequency: 0.01
  position_logging_interval: 0.1
  use_adaptive_control: false
  adaptive_config:
    leftright: "right"
    window_size: 10
    velocity_threshold: 0.15
    precision_threshold: 0.005
    smoothing_range: [0.5, 0.5]
    scaling_range: [1.0, 1.0]
  x_range: [-0.5, 0.3]
  y_range: [0.25, 1.4]
  z_range: [-0.5, 0.5]
  limit_rotation: true
  rx_range: [2, 3.14]
  ry_range: [0, 1.5]
  rz_range: [-2.7, 0]

hand_control:
  use_right_hand: true

hand_config:
  smoothing_factor: 0.6
  update_frequency: 0.01
  max_hand_range: 65535
  hand_speed: 1000

gripper_config:
  leftright: "right"
  max_width: 1000
  update_frequency: 0.001
  grip_sensitivity: 0.7
  default_speed: 100
  grip_activation_threshold: 0.3
  grip_release_threshold: 0.6

logging:
  console_level: "info"
  file_level: "info"
  max_file_size: 104857600
  backup_count: 5
