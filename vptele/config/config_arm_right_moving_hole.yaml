# Configuration schema version
config_version: 1

# Legacy non-HDF5 recorder (disabled for this collection profile)
record_data: false

# HDF5 recording
record_hdf5: true
hdf5_record_dir: "../../data/moving_hole_fixed_peg"

hdf5_force_hz: 500.0
hdf5_state_hz: 30.0
hdf5_image_hz: 30.0

# ACT-style action recording
hdf5_record_actions: true
hdf5_record_action_alias: true

hdf5_record_images: true
hdf5_camera_names:
  - "ee_cam"
  - "base_top_cam"

hdf5_image_width: 640
hdf5_image_height: 480

# Asynchronous recorder/render pipeline. Numeric samples and rendered frames
# are queued so HDF5 compression and disk I/O never block the 1 kHz physics loop.
hdf5_async_queue_size: 1024
hdf5_async_stop_timeout: 10.0
hdf5_append_block_image: 16
render_queue_size: 4
render_start_timeout: 10.0

hdf5_auto_start: false
hdf5_episode_label: "teleop"
hdf5_max_buffer_rows: 500000
hdf5_hole_center_site_name: "hole_goal_site"
hdf5_task_name: "moving_hole_fixed_peg"
hdf5_ee_body_name: "hole_tool"
hdf5_ft_force_sensor_name: "hole_ft_force"
hdf5_ft_torque_sensor_name: "hole_ft_torque"

# Task geometry metadata is read from these compiled MuJoCo objects.
hdf5_peg_geom_name: "fixed_cylindrical_peg"
hdf5_peg_tip_site_name: "fixed_peg_tip_site"
hdf5_hole_goal_site_name: "hole_goal_site"
hdf5_sampled_target_site_name: "fixed_peg_tip_site"
hdf5_hole_ring_geom_prefix: "tool_hole_ring_"
hdf5_hole_axis_body: [0.0, 0.0, 1.0]

# Force/torque sensor recording
hdf5_enable_ft_tare: false
# Force/torque gravity compensation
hdf5_ft_compensation_mode: "gravity"

# Keep diagnostic streams
hdf5_record_ft_wrench_raw: true
hdf5_record_ft_wrench_gravity: true

# Tool body downstream of the FT sensor
hdf5_ft_gravity_tool_body_names:
  - "hole_tool"

# World gravity
hdf5_ft_gravity_world: [0.0, 0.0, -9.81]

# MuJoCo FT sensor sign convention.
# If static compensation becomes worse, change this to 1.0.
hdf5_ft_gravity_sensor_sign: -1.0

# ROS service for data recording
enable_recording_service: true
recording_service_name: "/mujoco_hdf5_recording/set_recording"

# MuJoCo simulation
mujoco_model_path: "../../model/pangu_moving_hole_fixed_peg.xml"
control_mode: "actuator"
# The passive MuJoCo viewer duplicates the operator CCTV view and adds a
# 60 Hz synchronization path. Keep it off during dataset collection.
launch_viewer: true
auto_start: true
viewer_rate: 60.0
realtime: true
viewer_start_wait: 0.0

arm_joints:
  - "joint_1"
  - "joint_2"
  - "joint_3"
  - "joint_4"
  - "joint_5"
  - "joint_6"
  - "joint_7"
arm_sign: [-1, 1, 1, -1, 1, 1, 1]

enable_visual_guides: false
show_camera_streams: true
camera_stream_width: 640
camera_stream_height: 480
camera_stream_fps: 15.0
cctv_camera: "cctv_cam"
monitor_camera_names:
  - "cctv_cam"
  - "ee_cam"
  - "base_top_cam"
separate_cctv_window: true
cctv_window_name: "CCTV Camera"
cctv_window_width: 1280
cctv_window_height: 720
show_cctv_in_combined_panel: false
cctv_window_preserve_aspect_ratio: true
cctv_window_fullscreen: false
cctv_window_fit_mode: "contain"   # contain only for now
cctv_window_padding_color: [0, 0, 0]

# Optional mono WebRTC return of the final CCTV+HUD BGR frame to Vision Pro.
# This is independent of the raw ee_cam/base_top_cam HDF5 recording path.
visionpro_video_enabled: true
visionpro_video_port: 9999

# Operator-only live force feedback HUD.
# This overlay is drawn only on OpenCV display frames, never on HDF5 images.
enable_force_visual_feedback: true
force_feedback_display_mode: "overlay"   # overlay | window | off
force_feedback_overlay_cameras:
  - "cctv_cam"

force_feedback_low_threshold: 10.0
force_feedback_medium_threshold: 40.0
force_feedback_high_threshold: 80.0
force_feedback_excessive_threshold: 100.0

force_feedback_show_numbers: true
force_feedback_show_axial_lateral: true
force_feedback_show_trend: true
force_feedback_show_contact_state: true
force_feedback_show_arrow: false
force_feedback_smoothing_alpha: 0.25
force_feedback_window_name: "Force Feedback HUD"

force_feedback_insertion_axis_world: [0.0, -1.0, 0.0]
force_feedback_use_compensated_wrench: true
force_feedback_wrench_label: "comp"   # comp | raw

force_feedback_trend_window_sec: 0.8
force_feedback_trend_rising_threshold: 5.0
force_feedback_trend_falling_threshold: -5.0

force_feedback_contact_free_threshold: 5.0
force_feedback_contact_light_threshold: 15.0
force_feedback_axial_high_threshold: 20.0
force_feedback_lateral_high_threshold: 10.0
force_feedback_jam_force_threshold: 25.0
force_feedback_jam_lateral_threshold: 12.0

enable_task_force_guidance_hud: true
task_force_guidance_mode: "ring"   # ring | bars
force_guidance_overlay_cameras:
  - "cctv_cam"

show_translation_ring: true
show_torque_ring: true
show_axial_core: true

force_guidance_plane_right_world: [1.0, 0.0, 0.0]
force_guidance_plane_up_world: [0.0, 0.0, 1.0]

force_guidance_ring_radius_px: 70
force_guidance_max_vector_px: 55
force_guidance_max_force_n: 40.0
force_guidance_max_torque_nm: 2.0
torque_guidance_mode: "off"   # vector | tilt_axes | off
torque_guidance_min_force_n: 5.0
torque_guidance_min_torque_nm: 0.05
torque_guidance_label_as_posture: true
torque_guidance_show_numeric_values: true
force_guidance_draw_numeric_values: true
force_guidance_show_caveat_label: true
force_guidance_hud_anchor: "custom"   # top_left | top_right | bottom_left | bottom_right | center | custom
force_guidance_hud_margin_px: [40, 40]
force_guidance_hud_offset_px: [0, 0]
force_guidance_hud_center_norm: [0.50, 0.18]
force_guidance_basis_mode: "camera_screen"   # camera_screen | task_world | manual_world | sensor_debug
force_guidance_basis_camera: "cctv_cam"
force_guidance_screen_right_sign: 1.0
force_guidance_screen_up_sign: 1.0
force_guidance_vector_semantics: "contact"   # contact | correction
force_guidance_correction_sign: -1.0

# VisionPro配置
# vp_enabled: true  = 连接 VisionPro 进行人遥操作（默认）
# vp_enabled: false = 跳过 VisionPro，仅脚本控制器可用
# Manual commissioning is the safe default for the new tool/load model.
vp_enabled: true
# vp_ip: "192.168.8.145" # DaiLab-Normal
vp_ip: "172.20.10.2"
vp_record: false  # 是否记录VisionPro数据流
vp_ready_timeout: 2.0

# 末端执行器选择: none | hand | peg
end_effector: "peg"

# 机械臂遥控参数
arm_config:
  enable_episode_services: true
  teleop_service_ns: "/arm_teleop_mujoco"
  ik_service_name: "/arm_teleop/right_arm_ik_srv"
  initial_robot_pose: [0.3011, -0.3580, 0.2282, 3.1923149, -0.036102, -0.0007987]
  move: true
  scaling_factor: 0.8
  smoothing_factor: 0.99
  update_frequency: 0.01 # 根据日志，每秒能发送80个控制指令，也就是每一次操控，除开sleep了0.01秒，计算开销时间应该是 1/80 - 0.01 = 0.0025s
  pose_filter_min_cutoff: 0.1
  pose_filter_beta: 0.1
  joints_filter_min_cutoff: 0.1
  joints_filter_beta: 0.1

# 日志配置
logging:
  console_level: "info"
  file_level: "info"
  max_file_size: 104857600  # 最大日志文件大小 (100MB)
  backup_count: 5  # 备份日志文件数量
  log_prefix: "mujoco" # pangu or mujoco

# Episode-level teleoperation lifecycle
teleop_controlled_by_recording: true
accept_teleop_when_not_recording: false

# Arm reset
reset_arm_on_record_start: true
reset_arm_on_record_stop: true
reset_ignore_teleop_duration: 0.5

initial_arm_joints:
  - -0.046
  - -0.2
  - 0.0
  - 1.6
  - -1.32
  - 0.005
  - 0.005

# Force-aware actuator command velocity scaling
max_joint_velocity: 0.2
enable_force_velocity_scaling: true
force_velocity_medium_threshold: 40.0
force_velocity_high_threshold: 80.0
force_velocity_medium_scale: 0.4
force_velocity_high_scale: 0.15

# High-force command hold
enable_high_force_hold: true
high_force_hold_threshold: 100.0
high_force_hold_dwell_time: 0.15
high_force_hold_release_ratio: 0.8

# Fixed-target sampling: move the world-mounted peg, never the calibrated hole tool.
# Start with fixed mode for manual commissioning; grid mode remains available.
hole_sampling_mode: "fixed"            # grid | uniform_random | fixed
target_body_name: "fixed_peg_fixture"
hole_body_name: "fixed_peg_fixture"    # legacy compatibility alias

hole_grid_rows: 5
hole_grid_cols: 5
hole_grid_x_range: [-0.060, 0.060]
hole_grid_y_offset: 0.000
hole_grid_z_range: [-0.060, 0.060]

# center: fixed cell center; uniform_in_cell: deterministic point inside each cell
hole_grid_sample_mode: "center"

# shuffled: visit every cell once in a seeded random order; row_major: R1C1 -> R5C5
hole_grid_traversal_order: "shuffled"
hole_grid_seed: 42

# Kept episodes advance; discarded episodes retry the same cell.
hole_grid_advance_policy: "on_keep"    # on_keep | on_attempt

# Zero-based resume cursor. Change these only when resuming an interrupted run.
hole_grid_start_cycle: 0
hole_grid_start_index: 0


# Joint torque quality alarm
enable_joint_torque_alarm: true

# 只在 HDF5 recording active 时检查，避免非采集状态误报警
joint_torque_alarm_only_when_recording: true

# 一旦超限，本条 episode 内 peg 一直保持绿色
joint_torque_alarm_latched: true

# 每条新 episode 开始前清除报警
reset_joint_torque_alarm_on_record_start: true

# 超限后 peg 变绿色
joint_torque_alarm_peg_rgba: [0.0, 1.0, 0.0, 1.0]

# 7 个关节力矩限制，单位 Nm
# 这里先用占位值，后续根据你实际采集数据统计调整
joint_torque_limits:
  - 30.0
  - 30.0
  - 20.0
  - 20.0
  - 10.0
  - 10.0
  - 10.0

# End-effector FT wrench quality alarm
enable_ft_wrench_alarm: true
ft_wrench_alarm_only_when_recording: true
ft_wrench_alarm_latched: true
reset_ft_wrench_alarm_on_record_start: true

# Separate force and torque because units are different.
ft_force_norm_limit: 100.0          # N
ft_torque_norm_limit: 3.0          # Nm
ft_wrench_alarm_dwell_time: 0.25   # seconds

# Blue: FT alarm
# Green: joint torque alarm
# Purple: both alarms
ft_wrench_alarm_peg_rgba: [0.0, 0.2, 1.0, 1.0]
both_alarm_peg_rgba: [0.8, 0.0, 1.0, 1.0]

# 第一阶段建议 false，只报警、变色、写 event，不自动冻结
ft_wrench_alarm_freeze_on_trigger: false


# Task success auto-stop by task sites
enable_task_success_auto_stop: true

task_success_peg_site_name: "fixed_peg_tip_site"
task_success_hole_site_name: "hole_goal_site"
task_moving_site_name: "hole_goal_site"
task_target_site_name: "fixed_peg_tip_site"

# Require the virtual seating sites to agree within 1 mm.  The physical
# geometry still retains the separate 2 mm bottom/base clearance.
task_success_distance: 0.001

# 连续满足距离阈值多久才算成功，避免单帧误触发
task_success_dwell_time: 0.10

# 成功后停止接收新的遥操作命令
task_success_stop_accepting_teleop: true

# 成功后继续记录 terminal hold
task_success_terminal_hold_time: 5.0

# 触发成功后，用 0.2 秒从当前 command 平滑切到当前 qpos
task_success_blend_to_qpos_time: 0.2

# 只在 HDF5 recording active 时检查成功条件
task_success_only_when_recording: true

# 自动 stop 后先暂存，等待 keyboard client 人工 keep/discard
task_success_pending_manual_review: true

# ------------------------------------------------------------------
# Scripted peg-in-hole insertion controller
# ------------------------------------------------------------------
scripted_controller:
  # Set to true to enable scripted insertion collection. The standalone
  # automatic entry does not create a ROS service.
  # Enable after manual contact/FT sign commissioning succeeds.
  enabled: false

  # Startup review mode. main_mujoco.py CLI flags override these values;
  # collect_mujoco.py always selects auto.
  # manual: keep the existing console y/n review loop.
  # auto: automatically run until target_episodes have passed the quality gate.
  review_mode: "manual"              # manual | auto
  target_episodes: 0                 # required (>0) in auto mode
  max_attempts: 0                    # 0 => automatically use target_episodes * 5
  max_consecutive_rejections: 10    # stop early when the system is unhealthy
  reject_action: "quarantine"        # quarantine | delete
  shutdown_on_batch_complete: true  # legacy ROS entry only

  # Hard wall-clock guard for a single scripted controller attempt.
  episode_timeout_s: 180.0

  # Deterministic automatic retention policy. Safety events, missing success,
  # corrupt numeric streams and recorder errors are always hard rejects.
  auto_quality:
    require_task_success_event: true
    require_terminal_hold_event: true
    reject_on_warning: false
    min_state_samples: 10
    min_force_samples: 50
    min_image_samples: 3
    max_dropped_numeric_samples: 0
    max_dropped_image_samples: 0
    image_std_min: 3.0
    sampling_rate_tolerance: 0.25
    tracking_norm_p95_warn: 0.03
    tracking_norm_max_warn: 0.06
    force_p95_warn: 40.0
    force_max_warn: 60.0
    terminal_check_seconds: 0.8
    terminal_qvel_max_warn: 0.05
    terminal_force_max_warn: 15.0

  # Legacy ROS service name for manually triggering one episode.
  service_name: "/scripted_insertion/run"

  # HDF5 episode label.
  episode_label: "scripted"

  # Data collection mode:
  #   direct           = run scripted controller while recording HDF5
  #   two_stage_replay = stage1 generate expert command trace without HDF5,
  #                      stage2 replay that trace and record training HDF5
  collection_mode: "two_stage_replay"
  stage1_trace_hz: 30.0
  replay_hz: 30.0
  save_stage1_trace: true
  replay_final_settle_s: 0.5

  # After each scripted episode stops recording, ask y/n in the console.
  # y keeps the episode folder; n deletes that episode folder.
  manual_review_after_episode: true

  # Keep the scripted service active after review.
  # Press Enter to collect the next episode, or q + Enter to stop the loop.
  manual_review_enter_next_episode: true

  # Smooth transition after the deliberately offset socket-rim contact.
  # Freeze current joints briefly, retract with small Cartesian IK steps,
  # then wait for contact force to release before aligning to the hole.
  post_contact_settle_s: 0.15
  smooth_retract_steps: 18
  smooth_retract_step_wait_s: 0.04
  post_retract_force_release_n: 6.0
  post_retract_force_release_timeout_s: 1.0

  # Two-segment approach geometry. Speed/force-check timing still uses the
  # original APPROACH adaptive step_m/wait_s logic.
  approach_standoff_m: 0.030
  contact_offset_tolerance_mm: 1.0

  # Dense waypoint execution for the scripted align/insert segment.
  # Larger values are slower but reduce target jumps after contact.
  waypoint_align_steps: 30
  waypoint_insert_steps: 45
  waypoint_steps_per_wp: 90

  # Admittance control gains during the ALIGN phase.
  # K_lateral:    lateral (X,Z) correction per Newton of measured force [m/N]
  # K_axial:      axial (Y) correction per Newton above F_target       [m/N]
  # F_target:     desired axial contact force during alignment          [N]
  K_lateral: 0.0003
  K_axial: 0.0002
  F_target: 2.0

  # ALIGN phase: XY distance from hole centre that counts as aligned [m]
  align_tolerance_xy: 0.001

  # APPROACH phase: distance from hole entrance to start alignment [m]
  approach_distance: 0.03

  # INSERT phase: relative travel from first socket/peg contact to the
  # seated goal [m].  The 43 mm travel leaves 2 mm clearance to the
  # physical 45 mm blind-hole bottom and fixed peg base.
  insert_depth: 0.043

  # INSERT phase: lateral force threshold that triggers a retraction [N].
  # Exceeding this means the peg is hitting the hole wall sideways.
  insertion_lateral_limit: 8.0

  # Maximum retraction distance on lateral failure [m].
  max_retract: 0.005

  # Maximum number of INSERT→ALIGN retries before giving up.
  max_retries: 3

  # IK solver method: "optimal_ref", "feasible_ref", "optimal_std", "feasible_std"
  ik_method: "optimal_ref"

  # Control step rate [Hz].
  control_rate_hz: 100

  # Initial XY error injection magnitudes to sample from [mm].
  # One value is picked uniformly per episode; direction is 0-360 deg uniform.
  scripted_error_radius_mm: 10.0
  error_magnitudes_mm: [0.5, 1.5, 3.0, 5.0, 7.0]

  # Generic role mapping for socket-over-peg control.
  moving_site_name: "hole_goal_site"
  target_goal_site_name: "fixed_peg_tip_site"
  target_approach_site_name: "fixed_peg_approach_goal_site"
  insertion_axis_world: [0.0, -1.0, 0.0]

  # Randomize/fix the world-mounted peg fixture, not the calibrated tool.
  target_body_name: "fixed_peg_fixture"
  hole_body_name: "fixed_peg_fixture"  # legacy compatibility alias

  # Fixed fixture position from the XML.
  fixed_target_world_pos: [-0.250, -0.543500, 1.000]

  # Whether to reset arm to initial pose after each episode.
  reset_arm_on_stop: false

  # Grace period after arm reset before sending commands [s].
  reset_ignore_teleop_duration: 0.5
