# Data Recording
record_data: false
record_dir: "/home/stw/pangu/src/arm_teleop/data/peg_in_hole"
record_force_hz: 500.0
record_state_hz: 30.0
record_all_500hz: true


# HDF5 recording
record_hdf5: true
hdf5_record_dir: "/home/stw/pangu/src/arm_teleop/data/peg_hole_try"

hdf5_force_hz: 500.0
hdf5_state_hz: 30.0
hdf5_image_hz: 30.0

# ACT-style action recording
hdf5_record_actions: true
hdf5_record_action_alias: true

hdf5_record_images: true
hdf5_camera_names:
  - "ee_cam"
  - "base_top_cam"

hdf5_image_width: 640
hdf5_image_height: 480
hdf5_image_format: "hdf5_rgb"
hdf5_jpg_quality: 90

hdf5_auto_start: false
hdf5_episode_label: "teleop"
hdf5_max_buffer_rows: 500000

# Force/torque sensor recording
hdf5_enable_ft_tare: false
# hdf5_record_ft_wrench_raw: true
# Force/torque gravity compensation
hdf5_ft_compensation_mode: "gravity"

# Keep diagnostic streams
hdf5_record_ft_wrench_raw: true
hdf5_record_ft_wrench_gravity: true

# Tool body downstream of the FT sensor
hdf5_ft_gravity_tool_body_names:
  - "peg_tool"

# World gravity
hdf5_ft_gravity_world: [0.0, 0.0, -9.81]

# MuJoCo FT sensor sign convention.
# If static compensation becomes worse, change this to 1.0.
hdf5_ft_gravity_sensor_sign: -1.0

# ROS service for data recording
enable_recording_service: true
recording_service_name: "/mujoco_hdf5_recording/set_recording"

# Mujoco配置
# mujoco_model_path: "/home/stw/pangu/src/arm_teleop/model/right_arm_peg_tool.xml"
# mujoco_model_path: "/home/stw/pangu/src/arm_teleop/model/right_arm_peg_tool_wall.xml"
mujoco_model_path: "/home/stw/pangu/src/arm_teleop/model/pangu_all_right.xml"
enable_hand: false
enable_visual_guides: false
cctv_camera: "cctv_cam"
monitor_camera_names:
  - "cctv_cam"
  - "ee_cam"
  - "base_top_cam"
separate_cctv_window: true
cctv_window_name: "CCTV Camera"
cctv_window_width: 1280
cctv_window_height: 720
show_cctv_in_combined_panel: false
cctv_window_preserve_aspect_ratio: true
cctv_window_fullscreen: false
cctv_window_fit_mode: "contain"   # contain only for now
cctv_window_padding_color: [0, 0, 0]

# Operator-only live force feedback HUD.
# This overlay is drawn only on OpenCV display frames, never on HDF5 images.
enable_force_visual_feedback: true
force_feedback_display_mode: "overlay"   # overlay | window | off
force_feedback_overlay_cameras:
  - "cctv_cam"

force_feedback_low_threshold: 10.0
force_feedback_medium_threshold: 40.0
force_feedback_high_threshold: 80.0
force_feedback_excessive_threshold: 100.0

force_feedback_show_numbers: true
force_feedback_show_axial_lateral: true
force_feedback_show_trend: true
force_feedback_show_contact_state: true
force_feedback_show_arrow: false
force_feedback_smoothing_alpha: 0.25
force_feedback_window_name: "Force Feedback HUD"

force_feedback_insertion_axis_world: [0.0, -1.0, 0.0]
force_feedback_use_compensated_wrench: true
force_feedback_wrench_label: "comp"   # comp | raw

force_feedback_trend_window_sec: 0.8
force_feedback_trend_rising_threshold: 5.0
force_feedback_trend_falling_threshold: -5.0

force_feedback_contact_free_threshold: 5.0
force_feedback_contact_light_threshold: 15.0
force_feedback_axial_high_threshold: 20.0
force_feedback_lateral_high_threshold: 10.0
force_feedback_jam_force_threshold: 25.0
force_feedback_jam_lateral_threshold: 12.0

enable_task_force_guidance_hud: true
task_force_guidance_mode: "ring"   # ring | bars
force_guidance_overlay_cameras:
  - "cctv_cam"

show_translation_ring: true
show_torque_ring: true
show_axial_core: true
show_contact_state: true
show_trend: true

force_guidance_plane_right_world: [1.0, 0.0, 0.0]
force_guidance_plane_up_world: [0.0, 0.0, 1.0]

force_guidance_ring_radius_px: 70
force_guidance_max_vector_px: 55
force_guidance_max_force_n: 40.0
force_guidance_max_torque_nm: 2.0
force_guidance_draw_numeric_values: true
force_guidance_show_caveat_label: true
force_guidance_hud_anchor: "top_right"   # top_left | top_right | bottom_left | bottom_right | center | custom
force_guidance_hud_margin_px: [40, 40]
force_guidance_hud_offset_px: [0, 0]
force_guidance_hud_center_norm: [0.78, 0.28]
force_guidance_basis_mode: "camera_screen"   # camera_screen | task_world | manual_world | sensor_debug
force_guidance_basis_camera: "cctv_cam"
force_guidance_screen_right_sign: 1.0
force_guidance_screen_up_sign: 1.0
force_guidance_vector_semantics: "contact"   # contact | correction
force_guidance_correction_sign: -1.0

force_feedback_ft_compensation_mode: "gravity"
force_feedback_gravity_tool_body_names:
  - "peg_tool"
force_feedback_gravity_world: [0.0, 0.0, -9.81]
force_feedback_gravity_sensor_sign: -1.0

# VisionPro配置
vp_ip: "192.168.1.144" # DaiLab-Normal
vp_record: false  # 是否记录VisionPro数据流
# vuer: true
vuer: false


# 末端执行器选择: none, hand, gripper, peg
end_effector: "peg"

# 机械臂遥控参数
arm_config:
  leftright: "right" # 指定使用人的哪只手的位姿来操控
  # move: false

  enable_episode_services: true
  teleop_service_ns: "/arm_teleop_mujoco"

  
  scaling_factor: 0.8
  smoothing_factor: 0.99
  update_frequency: 0.01 # 根据日志，每秒能发送80个控制指令，也就是每一次操控，除开sleep了0.01秒，计算开销时间应该是 1/80 - 0.01 = 0.0025s
  position_logging_interval: 0.1  # 位置日志记录间隔(秒)

  # 启用自适应控制
  use_adaptive_control: false
  
  # 自适应控制参数
  adaptive_config:
    leftright: "right"
    window_size: 10  # 运动历史窗口大小
    velocity_threshold: 0.15  # 快速移动阈值 (m/s)
    precision_threshold: 0.005  # 精细操作阈值 (m)
    smoothing_range: [0.5, 0.5]  # 平滑系数范围
    scaling_range: [1.0, 1.0]  # 缩放系数范围

  # 位置范围限制
  x_range: [-0.5, 0.3]
  y_range: [0.25, 1.4]
  z_range: [-0.5, 0.5]
  # 旋转范围限制 (弧度制)
  limit_rotation: true  # 启用旋转限制
  rx_range: [2, 3.14]  # rx旋转范围
  ry_range: [0, 1.5]  # ry旋转范围
  rz_range: [-2.7, 0]  # rz旋转范围

# VisionPro手部控制配置
hand_control:
  use_right_hand: true  # 使用右手控制

# 灵巧手参数
hand_config:
  smoothing_factor: 0.6
  update_frequency: 0.01
  max_hand_range: 65535
  hand_speed: 1000  # 灵巧手最大速度 (1-1000)

# 夹爪参数
gripper_config:
  leftright: "right"
  max_width: 1000
  update_frequency: 0.001
  grip_sensitivity: 0.7
  default_speed: 100  # 夹爪默认速度 (1-100)
  # 手势检测参数
  grip_activation_threshold: 0.3  # 激活抓取的阈值
  grip_release_threshold: 0.6  # 释放抓取的阈值

# 日志配置
logging:
  console_level: "info"
  file_level: "info"
  max_file_size: 104857600  # 最大日志文件大小 (100MB)
  backup_count: 5  # 备份日志文件数量
  log_prefix: "mujoco" # pangu or mujoco

# # hole randomization
# enable_hole_randomization: true
# randomize_hole_on_record_start: true

# # 当前 pangu_all_right.xml 中实际存在的任务 body
# hole_random_body_name: "wall_task"

# # 第一阶段建议只随机墙面平面内的 x 和 z
# hole_random_x_range: [-0.020, 0.020]
# hole_random_y_range: [0.010, 0.010]
# hole_random_z_range: [-0.020, 0.020]

hole_random_seed: null

# Episode-level teleoperation lifecycle
teleop_controlled_by_recording: true
accept_teleop_when_not_recording: false

teleop_stop_service_name: "/arm_teleop_mujoco/stop"
teleop_recalibrate_service_name: "/arm_teleop_mujoco/recalibrate"
teleop_start_service_name: "/arm_teleop_mujoco/start"

# Arm reset
reset_arm_on_record_start: true
reset_arm_on_record_stop: true

initial_arm_joints:
  - -0.046
  - -0.2
  - 0.0
  - 1.6
  - -1.32
  - 0.005
  - 0.005

# Force-aware actuator command velocity scaling
max_joint_velocity: 0.1
enable_force_velocity_scaling: true
force_velocity_medium_threshold: 40.0
force_velocity_high_threshold: 80.0
force_velocity_medium_scale: 0.4
force_velocity_high_scale: 0.15

# High-force command hold
enable_high_force_hold: true
high_force_hold_threshold: 100.0
high_force_hold_dwell_time: 0.15
high_force_hold_release_ratio: 0.8

# Hole randomization
enable_hole_randomization: false
randomize_hole_on_record_start: false
hole_random_body_name: "wall_task"
hole_random_x_range: [-0.010, 0.010]
hole_random_y_range: [0.000, 0.000]
hole_random_z_range: [-0.010, 0.010]

# HDF5
hdf5_auto_start: false
enable_recording_service: true
recording_service_name: "/mujoco_hdf5_recording/set_recording"


# Joint torque quality alarm
enable_joint_torque_alarm: true

# 只在 HDF5 recording active 时检查，避免非采集状态误报警
joint_torque_alarm_only_when_recording: true

# 一旦超限，本条 episode 内 peg 一直保持绿色
joint_torque_alarm_latched: true

# 每条新 episode 开始前清除报警
reset_joint_torque_alarm_on_record_start: true

# 超限后 peg 变绿色
joint_torque_alarm_peg_rgba: [0.0, 1.0, 0.0, 1.0]

# 7 个关节力矩限制，单位 Nm
# 这里先用占位值，后续根据你实际采集数据统计调整
joint_torque_limits:
  - 30.0
  - 30.0
  - 20.0
  - 20.0
  - 10.0
  - 10.0
  - 10.0

# End-effector FT wrench quality alarm
enable_ft_wrench_alarm: true
ft_wrench_alarm_only_when_recording: true
ft_wrench_alarm_latched: true
reset_ft_wrench_alarm_on_record_start: true

# Separate force and torque because units are different.
ft_force_norm_limit: 100.0          # N
ft_torque_norm_limit: 3.0          # Nm
ft_wrench_alarm_dwell_time: 0.25   # seconds

# Blue: FT alarm
# Green: joint torque alarm
# Purple: both alarms
ft_wrench_alarm_peg_rgba: [0.0, 0.2, 1.0, 1.0]
both_alarm_peg_rgba: [0.8, 0.0, 1.0, 1.0]

# 第一阶段建议 false，只报警、变色、写 event，不自动冻结
ft_wrench_alarm_freeze_on_trigger: false


# Task success auto-stop by task sites
enable_task_success_auto_stop: true

task_success_peg_site_name: "peg_tip_site"
task_success_hole_site_name: "hole_goal_site"

# 两个 site 的距离小于该阈值，认为到达成功区域
# 初期建议稍微宽松，确认稳定后再收紧到 0.005
task_success_distance: 0.008

# 连续满足距离阈值多久才算成功，避免单帧误触发
task_success_dwell_time: 0.10

# 成功后停止接收新的遥操作命令
task_success_stop_accepting_teleop: true

# 成功后继续记录 terminal hold
task_success_terminal_hold_time: 1.0

# 触发成功后，用 0.2 秒从当前 command 平滑切到当前 qpos
task_success_blend_to_qpos_time: 0.2

# 只在 HDF5 recording active 时检查成功条件
task_success_only_when_recording: true

# 自动 stop 后先暂存，等待 keyboard client 人工 keep/discard
task_success_pending_manual_review: true
